# Test profile: no Docker, no external services.
#  - SQL    : H2 in PostgreSQL-compatibility mode
#  - Mongo  : Flapdoodle embedded MongoDB (auto-configured; no uri/host/port set on purpose)
#  - Kafka  : @EmbeddedKafka sets spring.kafka.bootstrap-servers per test class
spring:
  datasource:
    url: jdbc:h2:mem:tradestore;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    mongodb:
      database: tradestore-test

trade:
  kafka:
    partitions: 1

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.8
